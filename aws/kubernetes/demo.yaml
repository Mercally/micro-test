apiVersion: v1
kind: Namespace
metadata:
  name: lab-general
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: micro
  namespace: lab-general
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: micro-config
  namespace: lab-general
data:
  SPRING_APPLICATION_NAME: docs-simulator-general
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: 'true'
  S3_BUCKET: ${GENERAL_BUCKET}
  DATABASE_URL: jdbc:postgresql://${DB_HOST}:5432/lab_general?sslmode=verify-full&sslrootcert=/etc/rds-ca/us-east-1-bundle.pem
  SPRING_SQL_INIT_MODE: never
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '3'
  SIMULATOR_FAILURE_PROBABILITY: '0'
  SIMULATOR_FAILURES_BEFORE_SUCCESS: '0'
  OTEL_SDK_DISABLED: 'true'
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro
  namespace: lab-general
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro
  template:
    metadata:
      labels:
        app: micro
        lab-role: general
    spec:
      serviceAccountName: micro
      automountServiceAccountToken: false
      nodeSelector:
        lab-role: general
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ${DEMO_IMAGE}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: micro-config
        env:
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: rds-ca
        configMap:
          name: rds-ca
---
apiVersion: v1
kind: Service
metadata:
  name: micro
  namespace: lab-general
spec:
  type: ClusterIP
  selector:
    app: micro
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
