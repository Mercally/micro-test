AWSTemplateFormatVersion: '2010-09-09'
Description: 'Laboratorio privado us-east-1: ocho subredes, ocho tablas y endpoints. Sin salida a Internet.'
Parameters:
  EKSClusterName:
    Type: String
    Default: demo-seguros
    AllowedPattern: '[a-z][a-z0-9-]{2,29}'
    Description: Prefijo estable para cluster, colas, state machine y buckets.
  S3PrefixListId:
    Type: String
    AllowedPattern: pl-[a-f0-9]+
    Description: ID real de la managed prefix list com.amazonaws.us-east-1.s3; consultar antes de crear.
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  GeneralSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      AvailabilityZone: us-east-1a
      CidrBlock: 10.20.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-general-a
  GeneralRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: VPC
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-GeneralRouteTableA
  GeneralSubnetAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: GeneralSubnetA
      RouteTableId:
        Ref: GeneralRouteTableA
  GeneralSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      AvailabilityZone: us-east-1b
      CidrBlock: 10.20.12.0/24
