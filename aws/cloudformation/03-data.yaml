AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  micro-test AWS lab - 03 data. RDS PostgreSQL single-AZ (db.t4g.micro by default) in the
  workload AZ, own master secret without rotation (N17); S3 bucket for documents.

Parameters:
  Project:
    Type: String
    Default: micro-test
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
  NetworkStack:
    Type: String
    Default: micro-test-network
  SecurityStack:
    Type: String
    Default: micro-test-security
  EngineVersion:
    Type: String
    Default: '16'
    Description: >-
      Major version; RDS picks the default minor. Check: aws rds describe-db-engine-versions
      --engine postgres --default-only --query "DBEngineVersions[].EngineVersion"
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t4g.large]
    Description: Lab knob - the DB is one of the limits you measure. Changing it restarts the DB (~5 min).
  DocumentRetentionDays:
    Type: Number
    Default: 30

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${Project} RDS (isolated subnets, both AZs required by RDS)'
      SubnetIds: !Split [',', { 'Fn::ImportValue': !Sub '${NetworkStack}-DbSubnetIds' }]

  # Own secret WITHOUT rotation (decision N17): pods read it once at start; a rotating
  # RDS-managed secret would break them after 7 days. Rotate manually if ever needed.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/db/master'
      KmsKeyId: { 'Fn::ImportValue': !Sub '${SecurityStack}-DataKeyArn' }
      GenerateSecretString:
        SecretStringTemplate: '{"username":"docs"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\:;+%?&=#`''{}[]()<> '

  # Adds host/port/engine to the secret so it is a complete connection descriptor.
  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref Db
      TargetType: AWS::RDS::DBInstance

  # ponytail: single-AZ RDS PostgreSQL (N23). Fixed size, no auto-pause; MultiAZ=true or Aurora
  # Serverless v2 if failover or elastic capacity become part of the lab.
  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${Project}-db'
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: docs
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: { 'Fn::ImportValue': !Sub '${SecurityStack}-DataKeyArn' }
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [{ 'Fn::ImportValue': !Sub '${NetworkStack}-DbSecurityGroupId' }]
      AvailabilityZone: !Select [0, !GetAZs '']
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      CopyTagsToSnapshot: true

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-documents-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: { 'Fn::ImportValue': !Sub '${SecurityStack}-DataKeyArn' }
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-lab-documents
            Status: Enabled
            ExpirationInDays: !Ref DocumentRetentionDays
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub '${DocumentsBucket.Arn}/*'
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

Outputs:
  DbInstanceId:
    Value: !Ref Db
  DbEndpoint:
    Value: !GetAtt Db.Endpoint.Address
    Export: { Name: !Sub '${AWS::StackName}-DbEndpoint' }
  DbPort:
    Value: !GetAtt Db.Endpoint.Port
    Export: { Name: !Sub '${AWS::StackName}-DbPort' }
  DbSecretArn:
    Value: !Ref DbSecret
    Export: { Name: !Sub '${AWS::StackName}-DbSecretArn' }
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
    Export: { Name: !Sub '${AWS::StackName}-DocumentsBucketName' }
  DocumentsBucketArn:
    Value: !GetAtt DocumentsBucket.Arn
    Export: { Name: !Sub '${AWS::StackName}-DocumentsBucketArn' }
