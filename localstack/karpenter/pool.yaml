apiVersion: karpenter.cluster.x-k8s.io/v1alpha1
kind: ClusterAPINodeClass
metadata:
  name: micro-test-local-capd
spec:
  scalableResourceSelector:
    matchLabels:
      node.cluster.x-k8s.io/karpenter-member: ""
      lab.micro-test.local/cluster: micro-test-local-capd
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: micro-test-local-capd
spec:
  # Installer adds limits for three times the observed Docker CPU/RAM capacity.
  # CAPD nodes report shared host capacity; fixed 2 CPU/4Gi limits would miscount.
  template:
    metadata:
      labels:
        lab.micro-test.local/pool: elastic
    spec:
      nodeClassRef:
        group: karpenter.cluster.x-k8s.io
        kind: ClusterAPINodeClass
        name: micro-test-local-capd
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      expireAfter: Never
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    # Deterministic practice: scale-down is explicit; no automatic disruption.
    budgets:
      - nodes: "0"
