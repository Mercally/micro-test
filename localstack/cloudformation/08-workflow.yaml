AWSTemplateFormatVersion: '2010-09-09'
Description: LocalStack only. Independent micro-test-local laboratory.
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: micro-test-local-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
              Fn::ImportValue: micro-test-local-lambda-arn
  Machine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: micro-test-local-diagnostic
      StateMachineType: STANDARD
      RoleArn:
        Fn::GetAtt:
        - Role
        - Arn
      DefinitionString: RENDER_FROM_LOCAL_ASL
      DefinitionSubstitutions:
        DiagnosticLambdaArn:
          Fn::ImportValue: micro-test-local-lambda-arn
      Tags:
      - Key: Name
        Value: micro-test-local-diagnostic
      - Key: Lab
        Value: micro-test-local
Outputs:
  StateMachineArn:
    Value:
      Ref: Machine
    Export:
      Name: micro-test-local-state-machine-arn
