AWSTemplateFormatVersion: '2010-09-09'
Description: LocalStack only. Independent micro-test-local laboratory.
Resources:
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: micro-test-local-diagnostic
      EndpointConfiguration:
        Types:
        - REGIONAL
      Tags:
      - Key: Name
        Value: micro-test-local-diagnostic
      - Key: Lab
        Value: micro-test-local
  Diagnostic:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: Api
      ParentId:
        Fn::GetAtt:
        - Api
        - RootResourceId
      PathPart: diagnostic
  Method:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: Api
      ResourceId:
        Ref: Diagnostic
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Join:
          - ''
          - - arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/
            - Fn::ImportValue: micro-test-local-lambda-arn
            - /invocations
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: micro-test-local-lambda-arn
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/diagnostic
  Deployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId:
        Ref: Api
      StageName: lab
    DependsOn:
    - Method
    - Permission
Outputs:
  ApiId:
    Value:
      Ref: Api
    Export:
      Name: micro-test-local-api-id
