AWSTemplateFormatVersion: '2010-09-09'
Description: LocalStack only. Independent micro-test-local laboratory.
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: pipes.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: micro-test-local-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::ImportValue: micro-test-local-queue-arn
          - Effect: Allow
            Action:
            - states:StartExecution
            Resource:
              Fn::ImportValue: micro-test-local-state-machine-arn
Outputs:
  PipeName:
    Value: micro-test-local-diagnostic
    Export:
      Name: micro-test-local-pipe-name
  RoleArn:
    Value:
      Fn::GetAtt:
      - Role
      - Arn
    Export:
      Name: micro-test-local-pipe-role
Metadata:
  LocalStackGap: 2026.10.4 CloudFormation ignores DesiredState. lab.py creates Pipe
    through CreatePipe(STOPPED) after this IAM stack.
