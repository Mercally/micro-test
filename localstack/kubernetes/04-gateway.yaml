apiVersion: v1
kind: ServiceAccount
metadata:
  name: micro-test-local-gateway
  namespace: micro-test-local-general
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-test-local-gateway
  namespace: micro-test-local-general
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro-test-local-gateway
  template:
    metadata:
      labels:
        app: micro-test-local-gateway
        istio: micro-test-local-gateway
        lab-access: allowed
      annotations:
        inject.istio.io/templates: gateway
    spec:
      serviceAccountName: micro-test-local-gateway
      nodeSelector:
        lab-role: general
      containers:
      - name: istio-proxy
        image: auto
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: micro-test-local-gateway
  namespace: micro-test-local-general
spec:
  type: NodePort
  selector:
    app: micro-test-local-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 31080
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: micro-test-local-gateway
  namespace: micro-test-local-general
spec:
  selector:
    istio: micro-test-local-gateway
  servers:
  - port:
      number: 8080
      name: http
      protocol: HTTP
    hosts:
    - '*'
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: micro-test-local-micro
  namespace: micro-test-local-general
spec:
  hosts:
  - '*'
  gateways:
  - micro-test-local-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/
    - uri:
        exact: /actuator/health
    route:
    - destination:
        host: micro-test-local-micro
        port:
          number: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: micro-test-local-micro
  namespace: micro-test-local-general
spec:
  host: micro-test-local-micro
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
