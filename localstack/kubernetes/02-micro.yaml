apiVersion: v1
kind: ServiceAccount
metadata:
  name: micro-test-local-micro
  namespace: micro-test-local-general
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: micro-test-local-micro
  namespace: micro-test-local-general
spec:
  selector:
    app: micro-test-local-micro
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-test-local-micro
  namespace: micro-test-local-general
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro-test-local-micro
  template:
    metadata:
      labels:
        app: micro-test-local-micro
    spec:
      serviceAccountName: micro-test-local-micro
      nodeSelector:
        lab-role: general
      containers:
      - name: micro
        image: docs-simulator:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: micro-test-local-config
        - secretRef:
            name: micro-test-local-database
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '2'
            memory: 768Mi
